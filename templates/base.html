<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Basette Hub{% endblock %}</title>
    <style>
        nav { background: #1e293b; padding: 10px 20px; }
        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        nav > ul > li { position: relative; }
        nav a { color: white; text-decoration: none; }

        .dropdown { display: none; position: absolute; top: 100%; left: 0;
                    background: #334155; min-width: 160px; padding: 8px 0; z-index: 10; }
        .dropdown li { padding: 4px 16px; }
        nav > ul > li:hover .dropdown { display: block; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('inicio') }}">Inicio</a></li>
            <li>
                <a href="{{ url_for('ventas.listar_ventas_general') }}">Ventas</a>
                <ul class="dropdown">
                    <li><a href="{{ url_for('ventas.listar_ventas', modulo='energia') }}">Energía</a></li>
                    <li><a href="{{ url_for('ventas.listar_ventas', modulo='alarmas') }}">Alarmas</a></li>
                    <li><a href="{{ url_for('ventas.listar_ventas', modulo='telefonia') }}">Telefonía</a></li>
                    <li><a href="{{ url_for('ventas.listar_ventas', modulo='placas_solares') }}">Placas solares</a></li>
                </ul>
            </li>
            <li><a href="{{ url_for('auth.logout') }}">Cerrar sesión</a></li>
        </ul>
    </nav>

    <main style="padding: 20px;">
        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <ul>
                    {% for mensaje in mensajes %}
                        <li>{{ mensaje }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
