{% extends "base.html" %}

{% block titulo %}Editar usuario - Basette Hub{% endblock %}

{% block contenido %}
<a href="{{ url_for('usuarios.listar_usuarios') }}" class="boton-volver">← Volver al listado</a>
<h1>Editar usuario: {{ usuario.nombre }}</h1>

<div class="formulario-card">
<form method="POST" action="{{ url_for('usuarios.editar_usuario', usuario_id=usuario.id) }}">
    <div class="form-grid">
        <div class="form-grupo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
        </div>
        
        <div class="form-grupo">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" value="{{ usuario.dni or '' }}"
                pattern="[0-9]{8}[A-Za-z]" maxlength="9"
                title="8 números seguidos de una letra, ej: 12345678A">
        </div>

        <div class="form-grupo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
        </div>

        <div class="form-grupo">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" minlength="8">
        </div>

        <div class="form-grupo">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
                <option value="jefe_equipo" {% if usuario.rol == 'jefe_equipo' %}selected{% endif %}>Jefe de equipo</option>
                <option value="comercial" {% if usuario.rol == 'comercial' %}selected{% endif %}>Comercial</option>
            </select>
        </div>

        <div class="form-grupo" id="grupo-jefe">
            <label for="jefe_id">Jefe de equipo asignado</label>
            <select id="jefe_id" name="jefe_id">
                <option value="">-- Selecciona --</option>
                {% for jefe in jefes %}
                <option value="{{ jefe.id }}" {% if jefe.id == usuario.jefe_id %}selected{% endif %}>{{ jefe.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-grupo">
            <label class="label-checkbox">
                <input type="checkbox" name="activo" {% if usuario.activo %}checked{% endif %}>
                Usuario activo
            </label>
        </div>
    </div>

    <button type="submit">Guardar cambios</button>
</form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const rolSelect = document.getElementById('rol');
    const grupoJefe = document.getElementById('grupo-jefe');

    function actualizarVisibilidad() {
        grupoJefe.style.display = (rolSelect.value === 'comercial') ? 'block' : 'none';
    }

    rolSelect.addEventListener('change', actualizarVisibilidad);
    actualizarVisibilidad();
});
</script>
{% endblock %}
