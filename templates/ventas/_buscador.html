<div class="barra-herramientas">
    <form method="GET" action="{{ url_for(request.endpoint) }}" class="form-buscador">
        {% if modulo_actual %}
        <input type="hidden" name="modulo" value="{{ modulo_actual }}">
        {% endif %}
        <input type="text" name="buscar" value="{{ buscar or '' }}"
               placeholder="Buscar por nombre, DNI, teléfono, email o CUPS...">
        <button type="submit" class="boton-nuevo" style="margin: 0;">Buscar</button>
        {% if buscar %}
        <a href="{{ url_for(request.endpoint, modulo=modulo_actual) }}">Quitar filtro</a>
        {% endif %}
    </form>

    <div class="botones-exportar">
        <a href="{{ url_for('ventas.exportar_csv', modulo=modulo_actual, buscar=buscar) }}" class="boton-exportar">CSV</a>
        <a href="{{ url_for('ventas.exportar_excel', modulo=modulo_actual, buscar=buscar) }}" class="boton-exportar">Excel</a>
    </div>
</div>
